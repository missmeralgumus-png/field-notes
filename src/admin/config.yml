# =====================================================================
#  LOGIN SETTINGS  — you will replace this whole "backend" block with the
#  snippet DecapBridge gives you (Step 5 in the README). It will look like
#  this, with YOUR repo name and YOUR DecapBridge URLs filled in:
# =====================================================================
backend:
  name: git-gateway
  repo: your-github-username/field-notes      # <-- change to your repo
  branch: main
  identity_url: https://auth.decapbridge.com/sites/REPLACE_ME
  gateway_url: https://gateway.decapbridge.com

# Where uploaded images go
media_folder: "src/images"
public_folder: "/images"

# Nicer commit messages in your GitHub history
site_url: https://REPLACE-with-your-site.netlify.app
display_url: https://REPLACE-with-your-site.netlify.app

# =====================================================================
#  YOUR POSTS  — this defines the "New Field Notes post" form you fill in
# =====================================================================
collections:
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}  ·  {{fields.kind}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - label: "Category"
        name: "kind"
        widget: "select"
        options:
          - { label: "Idea (professional)", value: "ideas" }
          - { label: "A Day In (lifestyle)", value: "daily" }
        default: "ideas"
      - label: "Short summary (shown under the title)"
        name: "dek"
        widget: "text"
      - label: "Post"
        name: "body"
        widget: "markdown"
